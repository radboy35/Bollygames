<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Anuj's Bolly Games: a Bollywood and Hollywood quiz for teams on one shared screen.">
<title>Anuj's Bolly Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Mukta:wght@400;600;800&display=swap">
<style>
/* Layout: a single-screen cinema. Velvet house, a lit "screen" card for the question, ticket-stub scoreboard beside it. Deliberately single dark theme. */
:root {
  --velvet: #2a0c14;
  --velvet-2: #3d1220;
  --screen: #fbf3e0;
  --ink: #1d0a10;
  --marigold: #f2a71b;
  --marigold-dim: #b9790a;
  --rani: #e0306e;
  --muted: #d9b9a6;
  --line: rgba(242,167,27,.35);
  --display: "Rozha One", "Georgia", serif;
  --body: "Mukta", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: radial-gradient(ellipse at 50% -10%, #5a1a2c 0%, var(--velvet) 55%) fixed, var(--velvet);
  color: var(--screen);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
}
.wrap {
  max-width: 1100px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
  display: grid; gap: 20px;
}
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.logo { font-family: var(--display); font-size: clamp(28px, 6vw, 44px); line-height: 1; color: var(--marigold); letter-spacing: .01em; }
.logo small { display: block; font-family: var(--body); font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); margin-top: 6px; font-weight: 600; }
.bulbs { height: 8px; background: radial-gradient(circle, var(--marigold) 2.5px, transparent 3.5px) 0 0/16px 8px repeat-x; opacity: .8; }
@media (prefers-reduced-motion: no-preference) { .bulbs { animation: chase 1.2s steps(2) infinite; } }
@keyframes chase { to { background-position: 16px 0; } }

.head-btns { display: flex; gap: 8px; }
.logo { cursor: pointer; }
button { font: inherit; cursor: pointer; border: 0; border-radius: 6px; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--marigold); outline-offset: 2px; }
.btn { background: var(--marigold); color: var(--ink); font-weight: 800; padding: 10px 18px; }
.btn:hover { background: #ffbc3d; }
.btn.ghost { background: transparent; color: var(--marigold); box-shadow: inset 0 0 0 2px var(--line); font-weight: 600; }
.btn.ghost:hover { box-shadow: inset 0 0 0 2px var(--marigold); }
.btn:disabled { opacity: .4; cursor: default; }

.intro { display: grid; gap: 16px; max-width: 760px; }
.lede { margin: 0; font-size: clamp(17px, 2.2vw, 20px); line-height: 1.55; color: var(--muted); text-wrap: pretty; }
.chips { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.chips li { border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 15px; }
.chips b { color: var(--marigold); font-weight: 800; margin-right: 6px; font-variant-numeric: tabular-nums; }
#app { display: grid; gap: 24px; }
/* Setup */
.setup { display: grid; gap: 20px; align-items: start; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
.panel { background: var(--velvet-2); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.panel h2 { font-family: var(--display); font-weight: 400; font-size: 24px; margin: 0; color: var(--marigold); text-wrap: balance; }
.hint { color: var(--muted); font-size: 14px; margin: 0; }
.teams { display: grid; gap: 8px; }
.team-row { display: flex; gap: 8px; }
.team-row input { flex: 1; min-width: 0; }
input[type=text], input[type=number], select { background: var(--velvet); color: var(--screen); border: 1px solid var(--line); border-radius: 6px; padding: 9px 12px; font: inherit; }
.x { background: transparent; color: var(--muted); width: 40px; font-size: 20px; }
.x:hover { color: var(--rani); }
.reels { display: grid; gap: 6px; }
.reel-opt { display: flex; gap: 12px; align-items: baseline; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
.reel-opt:hover { background: rgba(242,167,27,.08); }
.reel-opt input { accent-color: var(--marigold); transform: translateY(2px); }
.reel-opt b { font-weight: 800; }
.reel-opt span { color: var(--muted); font-size: 14px; display: block; }
.reel-opt.soon { opacity: .55; cursor: default; }
.reel-opt .tot { font-style: normal; color: var(--marigold); font-weight: 600; }
.opts { display: flex; gap: 12px; flex-wrap: wrap; }
.opts label[hidden] { display: none; }
#per-n { width: 7em; }
.opts label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; font-weight: 600; }
.start { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: space-between; grid-column: 1 / -1; }
.start .btn { font-size: 20px; padding: 14px 28px; }

.seg-wrap { display: grid; gap: 6px; }
.seg-label { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; font-weight: 600; }
.seg { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px; background: var(--velvet); border: 1px solid var(--line); border-radius: 8px; padding: 4px; }
.seg button { background: transparent; color: var(--screen); padding: 8px 2px; min-width: 0; display: grid; gap: 0; line-height: 1.25; border-radius: 6px; }
.seg button b { font-weight: 800; font-size: 15px; }
.seg button span { font-size: 12px; color: var(--muted); }
.seg button:hover { background: rgba(242,167,27,.08); }
.seg button[aria-checked=true] { background: var(--marigold); color: var(--ink); }
.seg button[aria-checked=true] span { color: var(--ink); }
.ideas { display: grid; gap: 8px; }
.idea-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.idea { background: transparent; color: var(--screen); border: 1px dashed var(--line); border-radius: 999px; padding: 5px 12px; font-size: 14px; font-weight: 600; }
.idea:hover { border-color: var(--marigold); color: var(--marigold); }
.meta-r { display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.diff { border-radius: 999px; padding: 2px 10px; font-size: 11px; letter-spacing: .14em; color: var(--screen); }
.diff-E { background: #2f7d4f; }
.diff-M { background: var(--marigold-dim); }
.diff-H { background: var(--rani); }
/* Play */
.play { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr) 280px; align-items: start; }
@media (max-width: 820px) { .play { grid-template-columns: minmax(0,1fr); } }
.screen {
  background: var(--screen); color: var(--ink); border-radius: 4px;
  box-shadow: 0 0 0 10px #12050a, 0 0 60px rgba(251,243,224,.18);
  padding: clamp(20px, 4vw, 40px); display: grid; gap: 18px; min-height: 380px; align-content: start;
}
.meta { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; font-weight: 800; color: #8a3a4c; }
.reel-name { font-family: var(--display); font-size: clamp(26px, 4.5vw, 38px); line-height: 1.1; margin: 0; color: var(--rani); text-wrap: balance; letter-spacing: 0; text-transform: none; font-weight: 400; }
.rule { font-size: 15px; color: #6b3a45; margin: -10px 0 0; }
.q { font-size: clamp(22px, 3.6vw, 32px); font-weight: 800; line-height: 1.25; margin: 0; text-wrap: balance; }
.q.emoji { font-size: clamp(44px, 9vw, 76px); letter-spacing: .08em; line-height: 1.2; }
.clues { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.clues li { font-size: clamp(19px, 3vw, 26px); font-weight: 600; line-height: 1.3; display: grid; gap: 2px; }
.clues li span { font-size: 12px; letter-spacing: .2em; text-transform: uppercase; font-weight: 800; color: #8a3a4c; }
.clues li:last-child { font-weight: 800; }
.answer { border-top: 2px dashed #c9a58f; padding-top: 14px; }
.answer .label { font-size: 12px; letter-spacing: .2em; text-transform: uppercase; font-weight: 800; color: #8a3a4c; }
.answer .a { font-family: var(--display); font-size: clamp(26px, 4.5vw, 40px); line-height: 1.15; color: var(--ink); }
.answer .note { font-size: 15px; color: #6b3a45; }
.controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.controls .btn.ghost { color: #8a3a4c; box-shadow: inset 0 0 0 2px #d9bfae; }
.controls .btn.ghost:hover { box-shadow: inset 0 0 0 2px #8a3a4c; }
.timer { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 800; font-size: 22px; color: var(--ink); min-width: 3ch; text-align: right; }
.timer.low { color: var(--rani); }
.award { display: grid; gap: 8px; }
.award-label { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; font-weight: 800; color: #8a3a4c; }
.award-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.award-btns button { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px #d9bfae; padding: 8px 14px; font-weight: 600; }
.award-btns button[aria-pressed=true] { background: var(--ink); color: var(--marigold); box-shadow: none; }

/* Scoreboard: ticket stubs */
.board { display: grid; gap: 10px; }
.board h3 { margin: 0; font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); font-weight: 800; }
.stub {
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px;
  background: var(--velvet-2); border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px;
  position: relative;
}
.stub::before, .stub::after { content: ""; position: absolute; top: 50%; width: 14px; height: 14px; margin-top: -7px; border-radius: 50%; background: var(--velvet); border: 1px solid var(--line); }
.stub::before { left: -8px; } .stub::after { right: -8px; }
.stub .n { font-weight: 800; min-width: 0; overflow-wrap: anywhere; }
.stub .seat { font-size: 12px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; display: block; font-weight: 400; }
.stub .s { font-family: var(--display); font-size: 30px; color: var(--marigold); font-variant-numeric: tabular-nums; }
.stub.lead { border-color: var(--marigold); }
.progress { height: 6px; background: var(--velvet-2); border-radius: 3px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--marigold); transition: width .3s; }
.side-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.side-actions .btn { font-size: 14px; padding: 8px 12px; }

/* End */
.end { text-align: center; display: grid; gap: 16px; justify-items: center; padding-block: 20px; }
.end .kicker { letter-spacing: .3em; text-transform: uppercase; color: var(--muted); font-weight: 800; font-size: 13px; }
.end h2 { font-family: var(--display); font-weight: 400; font-size: clamp(40px, 9vw, 80px); line-height: 1; margin: 0; color: var(--marigold); text-wrap: balance; }
.end .final { display: grid; gap: 10px; width: min(100%, 420px); text-align: left; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; color: var(--muted); }

/* ===== Look A+E: A's velvet, marigold and bulb borders; E's boxed setup; faded posters and one animated hero poster. ===== */
:root { --bulb: radial-gradient(circle, #ffe3a3 2.2px, #f2a71b 3.6px, transparent 4.8px); --frame: #4a1222; }
body { position: relative; }
.wrap { position: relative; }
.logo .lg-a { color: var(--screen); }
.logo .lg-b { color: var(--marigold); text-shadow: 0 0 18px rgba(242,167,27,.35); }

/* faded poster wall */
.wall { position: absolute; top: 0; left: 0; right: 0; height: 640px; overflow: hidden; pointer-events: none; }
.poster { position: absolute; width: 150px; height: 222px; border-radius: 6px; overflow: hidden; opacity: .14; box-shadow: 0 10px 30px rgba(0,0,0,.6); }
.poster .sun { position: absolute; left: 50%; top: 44px; width: 84px; height: 84px; margin-left: -42px; border-radius: 50%; }
.poster .hill { position: absolute; left: -20px; right: -20px; bottom: 46px; height: 70px; border-radius: 50% 50% 0 0; }
.poster .pt { position: absolute; left: 8px; right: 8px; bottom: 10px; font-family: var(--display); font-size: 20px; line-height: 1; text-align: center; color: #fbf3e0; }
.wall::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(42,12,20,.25) 0%, rgba(42,12,20,.8) 60%, var(--velvet) 100%); }
@media (max-width: 600px) { .poster.p4, .poster.p5 { display: none; } }

/* intro with the animated poster */
.intro { max-width: none; grid-template-columns: minmax(0, 1fr) minmax(0, 300px); align-items: center; gap: 32px; padding-top: 12px; }
.intro-text { display: grid; gap: 16px; min-width: 0; }
@media (max-width: 760px) { .intro { grid-template-columns: minmax(0, 1fr); } .hero-poster { order: -1; justify-self: center; } }
.hero-poster { margin: 0; width: min(100%, 300px); }
.hp-frame { padding: 12px; border-radius: 14px; background: var(--bulb) 0 0/14px 14px, var(--frame); box-shadow: 0 0 40px rgba(242,167,27,.35); }
.hp-art { position: relative; aspect-ratio: 2 / 3; border-radius: 4px; overflow: hidden; color: var(--screen); text-align: center;
  background: linear-gradient(180deg, #2a0c14 0%, #7a1631 34%, #e0306e 56%, #f2a71b 72%, #3d1220 86%); box-shadow: inset 0 0 60px rgba(0,0,0,.65); }
.hp-zoom { position: absolute; inset: 0; }
.hp-rays { position: absolute; left: 50%; top: 58%; width: 700px; height: 700px; margin: -350px 0 0 -350px; border-radius: 50%;
  background: repeating-conic-gradient(rgba(255,227,163,.16) 0 6deg, rgba(255,227,163,0) 6deg 14deg); }
.hp-sun { position: absolute; left: 50%; top: 58%; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
  background: radial-gradient(circle, #fff1c9 0 30%, #ffc247 55%, rgba(242,167,27,0) 72%); }
.hp-scene { position: absolute; inset: 0; width: 100%; height: 100%; }
.hp-dust { position: absolute; inset: -20% 0 0; background: radial-gradient(circle, rgba(255,241,201,.7) 1px, transparent 1.6px) 0 0/37px 53px, radial-gradient(circle, rgba(255,241,201,.45) 1px, transparent 1.6px) 13px 21px/61px 47px; }
.hp-grain { position: absolute; inset: 0; background: repeating-radial-gradient(circle at 30% 40%, rgba(255,255,255,.035) 0 1px, transparent 1px 3px); mix-blend-mode: overlay; }
.hp-top { position: absolute; top: 4.5%; left: 0; right: 0; font-size: 10px; letter-spacing: .32em; text-transform: uppercase; font-weight: 800; color: #f6d9c9; }
.hp-title { position: absolute; top: 9.5%; left: 6%; right: 6%; font-family: var(--display); font-size: clamp(38px, 11vw, 46px); line-height: .92;
  background: linear-gradient(100deg, #f2a71b 0%, #ffe3a3 22%, #f2a71b 40%, #f2a71b 100%) 0 0/250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 3px 0 #1d0a10) drop-shadow(0 0 14px rgba(242,167,27,.45)); }
.hp-tag { position: absolute; top: 32%; left: 8%; right: 8%; font-size: 12px; font-weight: 600; font-style: italic; color: #fbf3e0; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
.hp-badge { position: absolute; top: 37.5%; right: 7%; transform: rotate(8deg); background: var(--screen); color: var(--ink); font-size: 10px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; padding: 4px 8px; border-radius: 3px; box-shadow: 0 0 0 2px var(--marigold); }
.hp-billing { position: absolute; bottom: 3.5%; left: 6%; right: 6%; font-size: 8.5px; line-height: 1.45; letter-spacing: .12em; text-transform: uppercase; color: #d9b9a6; }
.hp-billing b { display: block; color: var(--marigold); font-size: 11px; letter-spacing: .3em; margin-top: 3px; }
.hp-billing span { color: #fbf3e0; font-weight: 800; }
.hero-poster figcaption { font-size: 12px; color: var(--muted); text-align: center; margin-top: 8px; }
.hp-couple { transform-box: fill-box; transform-origin: 50% 100%; }
.hp-dupatta { transform-box: fill-box; transform-origin: 0% 50%; }
@media (prefers-reduced-motion: no-preference) {
  .hp-rays { animation: hpSpin 90s linear infinite; }
  .hp-sun { animation: hpPulse 6s ease-in-out infinite; }
  .hp-zoom { animation: hpZoom 20s ease-in-out infinite alternate; }
  .hp-couple { animation: hpSway 5s ease-in-out infinite; }
  .hp-dupatta { animation: hpFlutter 2.4s ease-in-out infinite; }
  .hp-title { animation: hpShine 7s ease-in-out infinite; }
  .hp-dust { animation: hpDrift 24s linear infinite; }
  .hp-frame { animation: hpChase 1.2s steps(2) infinite; }
}
@keyframes hpSpin { to { transform: rotate(360deg); } }
@keyframes hpPulse { 50% { transform: scale(1.07); } }
@keyframes hpZoom { to { transform: scale(1.05); } }
@keyframes hpSway { 0%, 100% { transform: rotate(-1.2deg); } 50% { transform: rotate(1.2deg); } }
@keyframes hpFlutter { 0%, 100% { transform: skewY(0deg) scaleX(1); } 50% { transform: skewY(-6deg) scaleX(1.06); } }
@keyframes hpShine { 0%, 55% { background-position: 100% 0; } 85%, 100% { background-position: 0 0; } }
@keyframes hpDrift { to { transform: translateY(20%); } }
@keyframes hpChase { to { background-position: 14px 0, 0 0; } }

/* boxed setup, like E */
.setup { grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); }
.panel { border-radius: 18px; padding: 22px 20px; background: linear-gradient(180deg, rgba(242,167,27,.06), rgba(242,167,27,0) 120px), var(--velvet-2); }
.panel h2 { display: flex; align-items: center; gap: 10px; }
.step { flex: 0 0 30px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--marigold); color: var(--ink); font-family: var(--body); font-size: 15px; font-weight: 800; }
.team-row input { border-radius: 10px; padding: 11px 14px; font-weight: 600; }
.lib-list { display: grid; gap: 10px; }
.lib-card { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--velvet); border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; cursor: pointer; }
.lib-card:has(input:checked) { border-color: var(--marigold); box-shadow: 0 0 18px rgba(242,167,27,.18); }
.lib-badge { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px; letter-spacing: .06em; color: var(--ink); }
.lib-txt { display: grid; min-width: 0; }
.lib-txt b { font-size: 17px; }
.lib-txt span { font-size: 13px; color: var(--muted); }
.lib-txt em { font-style: normal; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; font-weight: 800; color: var(--marigold); }
.lib-card input { width: 22px; height: 22px; accent-color: var(--marigold); }
.panel .reels { gap: 4px; }
.start { background: var(--velvet-2); border: 1px solid var(--line); border-radius: 18px; padding: 16px 20px; }
.start .btn { border: 8px solid transparent; border-radius: 12px; padding: 10px 26px;
  background: linear-gradient(var(--marigold), var(--marigold)) padding-box, var(--bulb) 0 0/14px 14px border-box, linear-gradient(var(--frame), var(--frame)) border-box; font-family: var(--display); font-weight: 400; font-size: 24px; }
.start .btn:hover { background: linear-gradient(#ffbc3d, #ffbc3d) padding-box, var(--bulb) 0 0/14px 14px border-box, linear-gradient(var(--frame), var(--frame)) border-box; }

/* marquee bulb border around every question */
.screen { border: 14px solid transparent; border-radius: 18px;
  background: linear-gradient(var(--screen), var(--screen)) padding-box, var(--bulb) 0 0/14px 14px border-box, linear-gradient(var(--frame), var(--frame)) border-box;
  box-shadow: 0 0 50px rgba(242,167,27,.3); }

/* Mode switch and Jeopardy board */
.modes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.mode { text-align: left; display: grid; gap: 4px; padding: 16px 18px; border-radius: 16px; background: var(--velvet-2); color: var(--screen); border: 2px solid var(--line); }
.mode b { font-family: var(--display); font-weight: 400; font-size: clamp(20px, 3.4vw, 26px); color: var(--marigold); line-height: 1.1; }
.mode span { font-size: 14px; color: var(--muted); }
.mode:hover { border-color: var(--marigold); }
.mode[aria-checked=true] { border: 10px solid transparent; padding: 8px 10px;
  background: linear-gradient(var(--velvet-2), var(--velvet-2)) padding-box, var(--bulb) 0 0/14px 14px border-box, linear-gradient(var(--frame), var(--frame)) border-box; box-shadow: 0 0 30px rgba(242,167,27,.3); }
@media (max-width: 520px) { .modes { grid-template-columns: minmax(0, 1fr); } }
.minus { display: flex; gap: 10px; align-items: center; font-size: 15px; }
.minus input { width: 20px; height: 20px; accent-color: var(--marigold); }
.jwrap { display: grid; gap: 12px; min-width: 0; }
.jmeta { display: flex; justify-content: space-between; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; font-weight: 800; color: var(--muted); }
.jscroll { overflow-x: auto; padding: 12px; border-radius: 18px; background: var(--bulb) 0 0/14px 14px, var(--frame); box-shadow: 0 0 40px rgba(242,167,27,.25); }
.jboard { display: grid; grid-template-columns: repeat(var(--cols), minmax(88px, 1fr)); gap: 8px; background: #1d0a10; padding: 8px; border-radius: 8px; min-width: calc(var(--cols) * 96px); }

        <button class="btn ghost" id="prev" type="button" ${S.idx === 0 ? "disabled" : ""}>Back</button>
        ${S.revealed ? `<button class="btn" id="next" type="button">${S.idx + 1 === total ? "See the winner" : "Next question"}</button>`
                     : `${r.clues && (S.clue || 0) < q.length - 1 ? `<button class="btn ghost" id="clue" type="button">Next clue</button>` : ""}<button class="btn" id="reveal" type="button">Reveal answer</button>`}
        ${S.timer && !S.revealed ? `<span class="timer" id="clock">${S.timer}</span>` : ""}
      </div>
    </section>
    <aside class="board">
      <h3>Scoreboard</h3>
      <div class="progress" aria-hidden="true"><i style="width:${(S.idx / total) * 100}%"></i></div>
      ${S.teams.map((t, i) => `<div class="stub ${t.score === max && max > 0 ? "lead" : ""}"><div class="n"><span class="seat">Row ${String.fromCharCode(65 + i)}</span>${esc(t.name)}</div><div class="s">${t.score}</div></div>`).join("")}
      <div class="side-actions" id="sideActions"><div class="pause-row"><button class="btn" id="pause" type="button">Pause</button><button class="btn ghost" id="saveExit" type="button">Save and exit</button></div><button class="btn ghost" id="quit" type="button">End game</button></div>
    </aside>
  </div>`;
}

function endHTML() {
  const ranked = S.teams.slice().sort((a, b) => b.score - a.score);
  const top = ranked[0].score;
  const winners = ranked.filter(t => t.score === top).map(t => t.name);
  return `<section class="end">
    <div class="kicker">The End</div>
    <h2>${winners.length > 1 ? "It's a tie!" : esc(winners[0]) + " wins!"}</h2>
    ${winners.length > 1 ? `<p class="hint">${winners.map(esc).join(" and ")} share the top spot.</p>` : ""}
    <div class="final">${ranked.map((t, i) => `<div class="stub ${t.score === top ? "lead" : ""}"><div class="n"><span class="seat">${i + 1}${["st", "nd", "rd"][i] || "th"} place</span>${esc(t.name)}</div><div class="s">${t.score}</div></div>`).join("")}</div>
    <div class="controls"><button class="btn" id="again" type="button">Play again</button><button class="btn ghost" id="setupBtn" type="button">Change teams or rounds</button></div>
  </section>`;
}

function bind() {
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  if (S.view === "setup") {
    const sync = () => { S.teams.forEach((t, i) => { const v = $("team-" + i).value.trim(); t.name = v || "Team " + (i + 1); }); };
    document.querySelectorAll(".team-row input").forEach(el => el.oninput = () => { sync(); save(); const bl = $("billing"); if (bl) bl.textContent = S.teams.map(t => t.name).join(" · "); });
    document.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { sync(); S.teams.splice(+b.dataset.rm, 1); render(); });
    document.querySelectorAll("[data-idea]").forEach(b => b.onclick = () => {
      sync(); const name = b.dataset.idea;
      if (S.teams.length < 6) S.teams.push({ name, score: 0 }); else S.teams[S.teams.length - 1].name = name;
      render(); });
    on("add", () => { sync(); S.teams.push({ name: "Team " + (S.teams.length + 1), score: 0 }); render(); });
    const count = () => { const n = S.reels.reduce((s, id) => s + per(id), 0), live = activeReels();
      if (S.mode === "board") { const cols = boardCols().length;
        $("count").textContent = S.libs.length && cols ? `${cols} categories, ${cols * 5} tiles. About ${Math.round(cols * 5 * 1.5)} minutes.` : "Pick at least one category.";
        $("go").disabled = !cols || !S.libs.length; return; }
      $("count").textContent = S.libs.length && live.length ? `${live.length} rounds, ${n} questions. About ${Math.round(n * 1.5)} minutes.` : (S.libs.length ? "Pick at least one round." : "Pick Bollywood, Hollywood movies or TV shows.");
      $("go").disabled = !activeReels().length || !S.libs.length; };
    document.querySelectorAll("[data-reel]").forEach(cb => cb.onchange = () => {
      S.reels = REELS.map(r => r.id).filter(id => $("reel-" + id).checked || (S.mode !== "board" && id === "final")); count(); save(); });
    document.querySelectorAll("[data-lib]").forEach(cb => cb.onchange = () => {
      sync(); S.libs = LIBS.map(l => l.id).filter(id => $("lib-" + id).checked); render(); });
    const setCustom = () => { const n = Math.round(+$("per-n").value); if (n >= 1) { S.per = Math.min(n, maxPer()); count(); save(); } };
    $("per").onchange = e => { const c = e.target.value === "custom"; $("per-n-wrap").hidden = !c;
      if (c) { $("per-n").max = maxPer(); setCustom(); $("per-n").focus(); } else { S.per = +e.target.value; count(); save(); } };
    $("per-n").oninput = setCustom;
    $("per-n").onchange = () => { setCustom(); $("per-n").value = S.per; };
    document.querySelectorAll("[data-timer]").forEach(b => b.onclick = () => {
      S.timer = +b.dataset.timer; save();
      document.querySelectorAll("[data-timer]").forEach(x => x.setAttribute("aria-checked", x === b)); });
    count();
    document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { sync(); S.mode = b.dataset.mode; render(); });
    on("go", () => { sync(); S.mode === "board" ? startBoard() : startGame(); });
  } else if (S.view === "play") {
    on("reveal", () => { const r = reel(cur().reel); if (r.clues) { S.cluePts = S.cluePts || {}; S.cluePts[S.idx] = clueValue(r.pts, S.clue || 0); } S.revealed = true; render(); });
    on("clue", () => { S.clue = (S.clue || 0) + 1; render(); });
    on("next", () => { if (S.idx + 1 >= S.queue.length) S.view = "end"; else { S.idx++; S.revealed = false; S.clue = 0; } render(); });
    on("prev", () => { S.idx--; S.revealed = true; render(); });
    document.querySelectorAll("[data-award]").forEach(b => b.onclick = () => {
      const i = +b.dataset.award, list = S.awarded[S.idx] = S.awarded[S.idx] || [], pts = playPts(reel(cur().reel));
      const k = list.indexOf(i);
      if (k >= 0) { list.splice(k, 1); S.teams[i].score -= pts; } else { list.push(i); S.teams[i].score += pts; }
      render();
    });
    on("quit", () => {
      $("sideActions").innerHTML = `<div class="confirm">End now and show results?<button class="btn" id="yesEnd" type="button">End game</button><button class="btn ghost" id="noEnd" type="button">Keep playing</button></div>`;
      on("yesEnd", () => { S.view = "end"; render(); });
      on("noEnd", render);
    });
  } else if (S.view === "board" || S.view === "clue") {
    bindBoard(on);
  } else {
    on("again", () => S.mode === "board" ? startBoard() : startGame());
    on("setupBtn", () => { S.view = "setup"; render(); });
  }
}

function startGame() {
  S.teams.forEach(t => t.score = 0);
  // Final Reel always plays last, in the order rounds are listed.
  S.queue = [];
  if (!S.reels.includes("final")) S.reels.push("final");
  S.reels = REELS.map(r => r.id).filter(id => S.reels.includes(id));
  S.reels.forEach(id => {
    const pool = S.libs.flatMap(lib => reel(id).qs[lib].map((_, q) => ({ reel: id, lib, q })));
    shuffle(pool).slice(0, per(id)).forEach(x => S.queue.push(x));
  });
  S.idx = 0; S.revealed = false; S.clue = 0; S.awarded = []; S.cluePts = {}; S.view = "play";
  render();
}

function startTimer(from) {
  left = from != null ? from : S.timer;
  const el0 = $("clock"); if (el0) { el0.textContent = left > 0 ? left : "Time!"; el0.classList.toggle("low", left <= 10); }
  if (left <= 0) return;
  tick = setInterval(() => {
    left--;
    const el = $("clock");
    if (!el) return stopTimer();
    el.textContent = Math.max(left, 0);
    el.classList.toggle("low", left <= 10);
    if (left <= 0) { stopTimer(); el.textContent = "Time!"; }
  }, 1000);
}
function stopTimer() { if (tick) clearInterval(tick); tick = null; }

function goHome() {
  if (S.paused && inGame()) { saveAndExit(); return; }
  if (!["play", "board", "clue"].includes(S.view)) { S.view = "setup"; render(); return; }
  const box = $("sideActions");
  box.innerHTML = `<div class="confirm">Leave this game and go back to the home screen? Scores will reset.<button class="btn" id="saveHome" type="button">Save and go home</button><button class="btn ghost" id="yesHome" type="button">Go home without saving</button><button class="btn ghost" id="noHome" type="button">Keep playing</button></div>`;
  $("yesHome").onclick = () => { S.view = "setup"; S.teams.forEach(t => t.score = 0); render(); window.scrollTo(0, 0); };
  $("noHome").onclick = render;
  $("saveHome").onclick = saveAndExit;
  box.scrollIntoView({ block: "nearest" });
}

// ===== Jeopardy board mode =====
const BOARD_VALUES = [100, 200, 300, 400, 500];
const VALUE_LEVEL = { 100: "E", 200: "E", 300: "M", 400: "H", 500: "H" };
const boardCols = () => activeReels().slice(0, 10);
const qKey = x => x.reel + "|" + x.lib + "|" + x.q;

function startBoard() {
  S.teams.forEach(t => t.score = 0);
  const used = new Set();
  S.board = boardCols().map(id => {
    const pool = shuffle(S.libs.flatMap(lib => reel(id).qs[lib].map((_, q) => ({ reel: id, lib, q }))));
    const tiles = BOARD_VALUES.map(v => {
      const pick = pool.find(x => !used.has(qKey(x)) && level(x.reel, x.lib, x.q) === VALUE_LEVEL[v]) || pool.find(x => !used.has(qKey(x)));
      if (!pick) return null;
      used.add(qKey(pick));
      return Object.assign({}, pick, { v, done: false, dd: false });
    });
    return { id, tiles };
  });
  const cand = [];
  S.board.forEach((c, ci) => c.tiles.forEach((t, ri) => { if (t && t.v >= 200) cand.push([ci, ri]); }));
  if (cand.length) { const [ci, ri] = cand[Math.floor(Math.random() * cand.length)]; S.board[ci].tiles[ri].dd = true; }
  S.view = "board"; S.cell = null; S.revealed = false; S.clue = 0; S.marks = {}; S.ddShown = false; S.control = 0;
  render();
}

function sideHTML(progress) {
  const max = Math.max(...S.teams.map(t => t.score));
  return `<aside class="board">
      <h3>Scoreboard</h3>
      <div class="progress" aria-hidden="true"><i style="width:${progress * 100}%"></i></div>
      ${S.teams.map((t, i) => `<div class="stub ${t.score === max && max > 0 ? "lead" : ""}"><div class="n"><span class="seat">Row ${String.fromCharCode(65 + i)}</span>${esc(t.name)}</div><div class="s">${t.score}</div></div>`).join("")}
      <div class="side-actions" id="sideActions"><div class="pause-row"><button class="btn" id="pause" type="button">Pause</button><button class="btn ghost" id="saveExit" type="button">Save and exit</button></div><button class="btn ghost" id="quit" type="button">End game</button></div>
    </aside>`;
}

function tilesLeft() { return S.board.reduce((n, c) => n + c.tiles.filter(t => t && !t.done).length, 0); }
function tilesAll() { return S.board.reduce((n, c) => n + c.tiles.filter(t => t).length, 0); }

function boardHTML() {
  const left = tilesLeft(), all = tilesAll();
  return `<div class="play${S.board.length > 6 ? " wide" : ""}">
    <section class="jwrap">
      <div class="jmeta"><span>Jeopardy board</span><span>${left} of ${all} tiles left</span></div>
      <div class="jscroll"><div class="jboard" style="--cols:${S.board.length}">
        ${S.board.map(c => `<div class="jcat">${reel(c.id).name}</div>`).join("")}
        ${BOARD_VALUES.map((v, ri) => S.board.map((c, ci) => {
          const t = c.tiles[ri];
          if (!t) return `<div class="jtile empty" aria-hidden="true"></div>`;
          if (t.done) return `<button class="jtile done" type="button" disabled aria-label="${reel(c.id).name} ${v}, already played"></button>`;
          return `<button class="jtile" type="button" data-cell="${ci}-${ri}" aria-label="${reel(c.id).name} for ${v}">${v}</button>`;
        }).join("")).join("")}
      </div></div>
      <p class="hint">Pick any tile. Higher values are harder. Right answers win the points, wrong answers lose them, and a miss can be stolen by another team. One tile hides a Daily Double worth twice as much (no steals on it).</p>
      <p class="hint">${esc(S.teams[Math.min(S.control || 0, S.teams.length - 1)].name)} picks next.</p>
    </section>
    ${sideHTML(all ? (all - left) / all : 0)}
  </div>`;
}

function clueHTML() {
  const [ci, ri] = S.cell, t = S.board[ci].tiles[ri], r = reel(t.reel), [q, a, note] = r.qs[t.lib][t.q], lib = LIBS.find(l => l.id === t.lib);
  const full = t.v * (t.dd ? 2 : 1), val = r.clues ? clueValue(full, S.clue || 0) : full, lv = level(t.reel, t.lib, t.q), all = tilesAll();
  const side = sideHTML(all ? (all - tilesLeft()) / all : 0);
  if (t.dd && !S.ddShown) return `<div class="play">
    <section class="screen dd" aria-live="polite">
      <div class="dd-kicker">${r.name} · ${t.v}</div>
      <h2 class="dd-title">Daily Double!</h2>
      <p class="rule">This tile is worth ${val} points.</p>
      <div class="controls" style="justify-content:center"><button class="btn" id="ddGo" type="button">Show the question</button></div>
    </section>${side}</div>`;
  return `<div class="play">
    <section class="screen" aria-live="polite">
      <div class="meta"><span>${r.name} · ${val} points${t.dd ? " · Daily Double" : ""}</span><span class="meta-r">${S.libs.length > 1 ? lib.tag : ""}<span class="diff diff-${lv}">${LEVELS[lv]}</span></span></div>
      <h2 class="reel-name">${r.name}</h2>
      <p class="rule">${r.rule}${r.clues ? ` Each new clue knocks a little off. Worth <b>${val} points</b>${S.revealed ? "" : " right now"}.` : ""}</p>
      ${r.clues ? clueList(q, S.revealed ? q.length : (S.clue || 0) + 1, full)
                 : `<p class="q ${r.emoji ? "emoji" : ""}">${esc(q)}</p>`}
      ${S.revealed ? `<div class="answer"><div class="label">Answer</div><div class="a">${esc(a)}</div>${note ? `<div class="note">${esc(note)}</div>` : ""}</div>` : ""}
      ${markHTML(t, val)}
      <div class="controls">
        ${S.revealed ? `<button class="btn" id="toBoard" type="button">${tilesLeft() <= 1 ? "See the winner" : "Back to the board"}</button>`
                     : `${r.clues && (S.clue || 0) < q.length - 1 ? `<button class="btn ghost" id="clue" type="button">Next clue</button>` : ""}<button class="btn" id="reveal" type="button">Reveal answer</button>`}
        ${S.timer && !S.revealed ? `<span class="timer" id="clock">${S.timer}</span>` : ""}
      </div>
    </section>${side}</div>`;
}

function markHTML(t, val) {
  const a = S.ans, m = S.marks, btn = (i, v, label) => `<button type="button" class="jmark ${v > 0 ? "ok" : "no"}" data-mark="${i}" data-val="${v}" aria-pressed="${m[i] === v}">${label}</button>`;
  const won = Object.keys(m).some(i => m[i] === 1);
  let h = `<div class="award">
    <div class="jturn"><b>Answering</b>${S.teams.map((tm, i) => `<button type="button" class="jpick" data-ans="${i}" aria-pressed="${i === a}">${esc(tm.name)}</button>`).join("")}</div>
    <div class="jteams"><div class="jteam"><span>${esc(S.teams[a].name)}</span>${btn(a, 1, `Right +${val}`)}${btn(a, -1, `Wrong −${val}`)}</div></div>`;
  if (m[a] === -1 && !t.dd && S.teams.length > 1) {
    const others = S.teams.map((tm, i) => i).filter(i => i !== a);
    h += `<div class="jsteal"><div class="award-label">Steal it! Another team can answer${S.revealed ? "" : " before you reveal"}</div>
      <div class="jteams">${others.map(i => (won && m[i] !== 1) ? "" : `<div class="jteam"><span>${esc(S.teams[i].name)}</span>${btn(i, 1, `Steal +${val}`)}${btn(i, -1, `Missed −${val}`)}</div>`).join("")}</div></div>`;
  }
  return h + `</div>`;
}

function bindBoard(on) {
  if (S.view === "board") {
    document.querySelectorAll("[data-cell]").forEach(b => b.onclick = () => {
      S.cell = b.dataset.cell.split("-").map(Number); S.revealed = false; S.clue = 0; S.marks = {}; S.ddShown = false; S.ans = Math.min(S.control || 0, S.teams.length - 1); S.view = "clue"; render(); window.scrollTo(0, 0); });
  } else {
    on("ddGo", () => { S.ddShown = true; render(); });
    on("reveal", () => { S.revealed = true; render(); });
    on("clue", () => { S.clue = (S.clue || 0) + 1; render(); });
    document.querySelectorAll("[data-mark]").forEach(b => b.onclick = () => {
      const i = +b.dataset.mark, v = +b.dataset.val;
      if (S.marks[i] === v) delete S.marks[i]; else S.marks[i] = v;
      if (i === S.ans && S.marks[i] !== -1) Object.keys(S.marks).forEach(k => { if (+k !== S.ans) delete S.marks[k]; });
      render(); });
    document.querySelectorAll("[data-ans]").forEach(b => b.onclick = () => { S.ans = +b.dataset.ans; S.marks = {}; render(); });
    on("toBoard", () => {
      const [ci, ri] = S.cell, t = S.board[ci].tiles[ri], full = t.v * (t.dd ? 2 : 1), val = reel(t.reel).clues ? clueValue(full, S.clue || 0) : full;
      Object.keys(S.marks).forEach(i => { S.teams[i].score += S.marks[i] * val; });
      const winner = Object.keys(S.marks).find(i => S.marks[i] === 1);
      if (winner !== undefined) S.control = +winner;
      t.done = true; S.cell = null; S.marks = {};
      S.view = tilesLeft() ? "board" : "end"; render(); });
  }
  on("quit", () => {
    $("sideActions").innerHTML = `<div class="confirm">End now and show results?<button class="btn" id="yesEnd" type="button">End game</button><button class="btn ghost" id="noEnd" type="button">Keep playing</button></div>`;
    on("yesEnd", () => { S.view = "end"; render(); });
    on("noEnd", render);
  });
}

$("home").onclick = goHome;
document.querySelector(".logo").onclick = goHome;

$("fs").onclick = () => {
  try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); } catch {}
};

if (!S.teams || !S.view) S = fresh();
{
  const known = id => REELS.some(r => r.id === id);
  const usesOld = g => g && ((g.queue || []).some(x => !known(x.reel)) || (g.board || []).some(c => !known(c.id)));
  if (S.reels) { S.reels = S.reels.filter(known); if (!S.reels.includes("dialogue") && !S.dialogueAdded) S.reels.splice(Math.max(S.reels.indexOf("random"), 0), 0, "dialogue"); S.dialogueAdded = true; S.reels = REELS.map(r => r.id).filter(id => S.reels.includes(id)); }
  if (usesOld(S.saved)) delete S.saved;
  if (["play", "board", "clue"].includes(S.view) && usesOld(S)) { S.view = "setup"; S.paused = false; S.teams.forEach(t => t.score = 0); }
}
if (!S.libs) { S.libs = ["bolly"]; if (S.view !== "setup") S.view = "setup"; }
render();
</script>
</body>
</html>
